[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recloser-performance"
version = "0.1.0"
description = "Desempenho e posicionamento de religadores com dados abertos da ANEEL (BDGD e interrupções)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "geopandas>=1.0",       # pyogrio.read_dataframe (scripts/00_cache_bdgd.py) exige geopandas
  "requests>=2.32",
  "pyyaml>=6",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/tabelas_docs.py" = ["E501"]   # gerador das tabelas dos docs: linhas de texto longas
