# Recorte e premissas do estudo. Valores marcados como "ilustrativo" devem ser calibrados pela distribuidora.
distribuidora: EMT
cache_bdgd: data/bdgd          # saída de scripts/00_cache_bdgd.py (camadas da BDGD em Parquet por ano)
snapshots_bdgd:                # id do item no ArcGIS Hub da ANEEL (BDGD de 31/12 de cada ano, Energisa MT)
  2024: 8fed7443387d4d04a361e7f4d1edea64
  2025: 02a120db1b5149709f8d371c21635adc
ano_atual: 2025                # snapshot usado no diagnóstico e na otimização
ano_backtest: 2024             # snapshot usado para testar a priorização contra as instalações de 2025

# Bases geradas pelo projeto distribution-asset-risk (falhas por alimentador e interrupções harmonizadas)
falhas: ../distribution-asset-risk/data/interim/falhas.parquet
interrupcoes: ../distribution-asset-risk/data/interim/interrupcoes_emt.parquet
# Valoração e efeito medido de religadores (projeto automation-impact)
valor_json: ../automation-impact/reports/valor.json

tip_unid:                      # PRODIST Módulo 10, domínio TUNI (mesmos códigos do distribution-asset-risk)
  religador: ["32"]
  seccionalizador: ["35", "36"]
  fusivel: ["22", "23", "24", "25", "26", "27"]
  disjuntor: ["29", "30", "53"]

topologia:
  max_gap_m: 500               # lacuna máxima para religar um componente desconectado ao alimentador

confiabilidade:
  anos_taxa: [2023, 2024, 2025]
  tau: 0.5                     # fração de faltas transitórias eliminadas por religamento (premissa; sensibilidade 0,3–0,7)
  fator_calibracao_min: 0.2    # limites do ajuste CI observado / CI do modelo por alimentador
  fator_calibracao_max: 5.0

otimizacao:
  ks: [25, 50, 100, 200]
  min_clientes: 50             # clientes mínimos a jusante e protegidos para um nó ser candidato
  max_religadores_em_serie: 3  # religadores de linha em série abaixo do disjuntor (coordenação)
  sorteios_aleatorio: 10

valor:
  custo_religador_rs: 160000   # ilustrativo, igual ao automation-impact
  vida_anos: 20
  taxa_desconto: 0.08

backtest:
  raio_novo_m: 100             # religador de 2025 sem religador de 2024 a menos disso conta como instalação nova
  raio_localizacao_m: 50       # distância máxima até o nó da rede de 2024
